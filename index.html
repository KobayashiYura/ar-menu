<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">

    <title>飲食店のAR3Dメニュー</title>
</head>
<body>
    <div class="app-container">
    
    <!-- 上半分：3Dモデルがぐるぐる回るエリア -->
    <div class="viewer-area">
      <model-viewer id="food-model" src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" ar ar-modes="webxr scene-viewer quick-look" camera-controls auto-rotate>
        <!-- AR起動用の青いボタン -->
        <button slot="ar-button" class="ar-button">
          スマホのカメラでAR表示 📷
        </button>
      </model-viewer>
    </div>

    <!-- 下半分：白いカード風の情報エリア -->
    <div class="info-area">
      <h1 class="menu-title">特製ハンバーガー</h1>
      <p class="menu-price">¥850 <span class="tax-info">(税込)</span></p>
      <p class="menu-desc">ジューシーなパティと新鮮な野菜を使った特製バーガーです。外国のお客様にも大人気！(Popular with tourists!)</p>
      
      <!-- 普通盛り/大盛りの切り替えボタン -->
      <div class="size-buttons">
        <button id="btn-normal" class="btn active">普通盛り</button>
        <button id="btn-large" class="btn">大盛り</button>
      </div>
    </div>

  </div>
    <script src="script.js"></script>
</body>
</html>
