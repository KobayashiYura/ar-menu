<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocumentAR3Dメニューテスト</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="container">
        <h2>サイズ切り替えテスト</h2>

        <!-- id="menu-viewer" を追加してJavaScriptから操作できるようにしています -->
        <model-viewer
        id="menu-viewer"
        src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
        alt="サンプル3Dモデル"
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        touch-action="pan-y"
        shadow-intensity="1">
        </model-viewer>

        <!-- ★切り替えボタンエリア -->
        <div class="controls">
        <button id="btn-normal" class="btn active">普通盛り (モデルA)</button>
        <button id="btn-large" class="btn">大盛り (モデルB)</button>
        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
